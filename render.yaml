services:
  - type: web
    name: google-marketing-mcp
    runtime: node
    plan: free # upgrade to starter for always-on (free sleeps when idle)
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_AUTH_MODE
        value: bearer
      - key: PROJECTS_CONFIG
        value: ./config/projects.yaml
      - key: MCP_AUTH_TOKEN_FILE
        value: ./secrets/mcp-bearer.txt
      - key: TOKEN_ENCRYPTION_KEY_FILE
        value: ./secrets/token-key.txt
      # Public hostname is appended automatically at boot from
      # RENDER_EXTERNAL_HOSTNAME; keep loopback entries for health checks.
      - key: MCP_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      # --- secrets: Render prompts for these on first Blueprint sync ---
      - key: RENDER_MCP_BEARER_TOKEN
        sync: false
      - key: RENDER_PROJECTS_YAML
        sync: false
      - key: RENDER_SERVICE_ACCOUNT_JSON
        sync: false
      # Only needed for type: oauth profiles (authorize locally, paste here):
      - key: RENDER_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: RENDER_OAUTH_CLIENT_JSON
        sync: false
      - key: RENDER_GOOGLE_TOKEN_ENC
        sync: false
